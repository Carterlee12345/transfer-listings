<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단기임대 양도 매물 | Homes in Korea</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Apple SD Gothic Neo', -apple-system, BlinkMacSystemFont, sans-serif; background: #f4f6fb; color: #111827; line-height: 1.6; }

/* Header */
.header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 0 40px; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 6px rgba(11,37,89,.07); }
.header-inner { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 68px; }
.logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.logo-badge { background: #0b2559; color: #fff; font-size: .75rem; font-weight: 800; padding: 5px 12px; border-radius: 6px; letter-spacing: .5px; }
.logo-text { font-size: 1.05rem; font-weight: 800; color: #0b2559; letter-spacing: -.3px; }
.logo-sub { font-size: .72rem; color: #94a3b8; font-weight: 500; margin-top: 1px; }
.btn-admin { padding: 8px 20px; border-radius: 7px; border: 1.5px solid #0b2559; color: #0b2559; background: #fff; font-size: .83rem; font-weight: 700; cursor: pointer; transition: all .2s; letter-spacing: -.2px; }
.btn-admin:hover { background: #0b2559; color: #fff; }

/* Hero */
.hero { background: linear-gradient(135deg, #0b2559 0%, #1a4abf 60%, #2563eb 100%); padding: 72px 40px 80px; position: relative; overflow: hidden; }
.hero::before { content: ''; position: absolute; top: -60px; right: -60px; width: 400px; height: 400px; background: rgba(255,255,255,.04); border-radius: 50%; }
.hero::after { content: ''; position: absolute; bottom: -80px; left: -40px; width: 300px; height: 300px; background: rgba(255,255,255,.03); border-radius: 50%; }
.hero-inner { max-width: 1120px; margin: 0 auto; position: relative; z-index: 1; }
.hero-eyebrow { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); color: rgba(255,255,255,.9); font-size: .75rem; font-weight: 700; padding: 5px 14px; border-radius: 20px; margin-bottom: 20px; letter-spacing: .3px; }
.hero h1 { font-size: 2.6rem; font-weight: 900; color: #fff; line-height: 1.25; margin-bottom: 14px; letter-spacing: -1px; }
.hero h1 em { color: #93c5fd; font-style: normal; }
.hero p { font-size: 1rem; color: rgba(255,255,255,.75); margin-bottom: 40px; max-width: 480px; line-height: 1.7; }
.hero-stats { display: flex; gap: 40px; }
.stat { }
.stat-num { font-size: 1.8rem; font-weight: 900; color: #fff; letter-spacing: -1px; line-height: 1; }
.stat-label { font-size: .75rem; color: rgba(255,255,255,.55); font-weight: 500; margin-top: 4px; }

/* Trust bar */
.trust-bar { background: #fff; border-bottom: 1px solid #e2e8f0; }
.trust-bar-inner { max-width: 1120px; margin: 0 auto; padding: 0 40px; display: flex; align-items: center; gap: 0; }
.trust-item { display: flex; align-items: center; gap: 8px; padding: 16px 28px 16px 0; margin-right: 28px; border-right: 1px solid #e2e8f0; font-size: .8rem; color: #475569; font-weight: 600; }
.trust-item:last-child { border-right: none; }
.trust-icon { font-size: 1rem; }

/* Tabs */
.tabs-wrap { background: #fff; border-bottom: 2px solid #e2e8f0; position: sticky; top: 68px; z-index: 90; }
.tabs { max-width: 1120px; margin: 0 auto; display: flex; padding: 0 40px; overflow-x: auto; scrollbar-width: none; gap: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 16px 22px; font-size: .88rem; font-weight: 700; color: #94a3b8; cursor: pointer; border: none; background: none; border-bottom: 2.5px solid transparent; margin-bottom: -2px; white-space: nowrap; transition: all .18s; letter-spacing: -.2px; }
.tab:hover { color: #0b2559; }
.tab.active { color: #0b2559; border-bottom-color: #0b2559; }

/* Main */
.main { max-width: 1120px; margin: 0 auto; padding: 44px 40px 80px; }
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
.section-title { font-size: 1rem; font-weight: 800; color: #1e293b; letter-spacing: -.3px; }
.count-badge { background: #eff6ff; color: #1d4ed8; font-size: .78rem; font-weight: 700; padding: 4px 12px; border-radius: 20px; }

/* Grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; }

/* Card */
.card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04); transition: all .25s cubic-bezier(.4,0,.2,1); cursor: pointer; border: 1px solid #e8eef7; }
.card:hover { transform: translateY(-5px); box-shadow: 0 12px 40px rgba(11,37,89,.13); border-color: #bfdbfe; }

/* Slideshow */
.slideshow { position: relative; height: 230px; background: #e8eef7; overflow: hidden; }
.slide { position: absolute; inset: 0; opacity: 0; transition: opacity .4s; }
.slide.active { opacity: 1; }
.slide img { width: 100%; height: 100%; object-fit: cover; }
.slide-placeholder { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8; gap: 8px; }
.slide-placeholder-icon { font-size: 2.5rem; opacity: .5; }
.slide-placeholder-text { font-size: .75rem; font-weight: 600; }
.slide-nav { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; }
.slide-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.5); cursor: pointer; transition: all .2s; }
.slide-dot.active { background: #fff; width: 16px; border-radius: 3px; }
.slide-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.92); border: none; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px; transition: all .2s; opacity: 0; box-shadow: 0 2px 8px rgba(0,0,0,.15); color: #0b2559; font-weight: 700; }
.slideshow:hover .slide-btn { opacity: 1; }
.slide-btn:hover { background: #fff; transform: translateY(-50%) scale(1.05); }
.slide-btn.prev { left: 12px; }
.slide-btn.next { right: 12px; }
.img-count { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,.5); color: #fff; font-size: .7rem; font-weight: 700; padding: 3px 9px; border-radius: 10px; letter-spacing: .2px; }
.loc-tag { position: absolute; top: 12px; left: 12px; background: #0b2559; color: #fff; font-size: .7rem; font-weight: 800; padding: 4px 11px; border-radius: 6px; letter-spacing: .2px; }

/* Card body */
.card-body { padding: 20px 22px 22px; }
.card-address { font-size: .93rem; font-weight: 700; color: #0f172a; margin-bottom: 16px; line-height: 1.45; }
.price-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; background: #f4f6fb; border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
.price-cell { padding: 12px 14px; }
.price-cell:first-child { border-right: 1px solid #e2e8f0; }
.price-label { font-size: .68rem; color: #94a3b8; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
.price-value { font-size: 1.1rem; font-weight: 900; color: #0b2559; letter-spacing: -.5px; }
.info-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.chip { background: #f1f5f9; color: #475569; font-size: .72rem; font-weight: 600; padding: 4px 10px; border-radius: 6px; }
.chip span { color: #1e293b; font-weight: 700; }
.btn-visit { width: 100%; padding: 13px; background: #0b2559; color: #fff; border: none; border-radius: 10px; font-size: .88rem; font-weight: 800; cursor: pointer; transition: all .2s; letter-spacing: -.2px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.btn-visit:hover { background: #1a3a8f; }

/* Empty */
.empty { text-align: center; padding: 100px 20px; }
.empty-icon { font-size: 3.5rem; margin-bottom: 16px; opacity: .4; }
.empty h3 { font-size: 1rem; font-weight: 700; color: #64748b; margin-bottom: 6px; }
.empty p { font-size: .85rem; color: #94a3b8; }

/* Modal */
.overlay { position: fixed; inset: 0; background: rgba(11,37,89,.4); backdrop-filter: blur(4px); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
.overlay.open { display: flex; }
.modal { background: #fff; border-radius: 20px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; box-shadow: 0 24px 80px rgba(11,37,89,.2); }
.modal-header { padding: 24px 24px 16px; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: #fff; z-index: 1; border-radius: 20px 20px 0 0; }
.modal-title { font-size: 1.05rem; font-weight: 800; color: #0f172a; letter-spacing: -.3px; }
.modal-addr { font-size: .78rem; color: #94a3b8; margin-top: 2px; }
.modal-close { background: #f1f5f9; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 1rem; color: #64748b; transition: all .2s; display: flex; align-items: center; justify-content: center; }
.modal-close:hover { background: #e2e8f0; color: #374151; }
.modal-body { padding: 22px 24px 28px; }

/* Step indicator */
.steps { display: flex; gap: 0; margin-bottom: 24px; }
.step { flex: 1; text-align: center; padding: 10px 8px; font-size: .72rem; font-weight: 700; color: #cbd5e1; border-bottom: 2px solid #f1f5f9; transition: all .2s; }
.step.active { color: #0b2559; border-bottom-color: #0b2559; }
.step.done { color: #22c55e; border-bottom-color: #22c55e; }

/* Calendar */
.cal-label { font-size: .83rem; font-weight: 800; color: #1e293b; margin-bottom: 12px; letter-spacing: -.2px; }
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-month { font-size: .92rem; font-weight: 800; color: #0f172a; }
.cal-btn { background: #f4f6fb; border: none; border-radius: 8px; width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; color: #475569; transition: all .2s; }
.cal-btn:hover { background: #e2e8f0; color: #0b2559; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 20px; }
.cal-day-name { text-align: center; font-size: .68rem; color: #94a3b8; font-weight: 700; padding: 6px 0; letter-spacing: .3px; }
.cal-day { text-align: center; padding: 9px 4px; border-radius: 8px; font-size: .83rem; cursor: pointer; transition: all .18s; border: 1.5px solid transparent; font-weight: 600; color: #374151; }
.cal-day:hover:not(.disabled):not(.empty-day) { background: #eff6ff; border-color: #bfdbfe; color: #0b2559; }
.cal-day.selected { background: #0b2559; color: #fff; border-color: #0b2559; }
.cal-day.today:not(.selected) { color: #1d4ed8; font-weight: 900; }
.cal-day.disabled { color: #e2e8f0; cursor: not-allowed; }
.cal-day.empty-day { cursor: default; }

/* Time slots */
.time-label { font-size: .83rem; font-weight: 800; color: #1e293b; margin-bottom: 12px; letter-spacing: -.2px; }
.time-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-bottom: 20px; }
.time-slot { padding: 10px 6px; text-align: center; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: .8rem; cursor: pointer; transition: all .18s; color: #374151; font-weight: 700; background: #fff; }
.time-slot:hover { border-color: #93c5fd; background: #eff6ff; color: #0b2559; }
.time-slot.selected { background: #0b2559; color: #fff; border-color: #0b2559; }

/* Form */
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: .78rem; font-weight: 800; color: #374151; margin-bottom: 6px; letter-spacing: -.1px; }
.form-group input { width: 100%; padding: 12px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: .9rem; outline: none; transition: border-color .2s; color: #0f172a; background: #fff; }
.form-group input:focus { border-color: #0b2559; box-shadow: 0 0 0 3px rgba(11,37,89,.08); }
.form-group input::placeholder { color: #cbd5e1; }
.btn-submit { width: 100%; padding: 14px; background: #0b2559; color: #fff; border: none; border-radius: 11px; font-size: .92rem; font-weight: 800; cursor: pointer; transition: all .2s; margin-top: 6px; letter-spacing: -.2px; }
.btn-submit:hover { background: #1a3a8f; }
.btn-submit:disabled { background: #cbd5e1; cursor: not-allowed; }

/* Success */
.success-wrap { text-align: center; padding: 24px 16px 8px; }
.success-circle { width: 72px; height: 72px; background: #f0fdf4; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 16px; }
.success-wrap h3 { font-size: 1.1rem; font-weight: 800; color: #0f172a; margin-bottom: 8px; }
.success-wrap p { font-size: .85rem; color: #64748b; line-height: 1.7; }
.success-detail { background: #f4f6fb; border-radius: 10px; padding: 14px 16px; margin-top: 16px; text-align: left; font-size: .82rem; color: #475569; line-height: 1.9; }
.success-detail strong { color: #0f172a; font-weight: 700; }

@media (max-width: 640px) {
  .hero h1 { font-size: 1.9rem; }
  .hero-stats { gap: 24px; }
  .main { padding: 28px 20px 60px; }
  .grid { grid-template-columns: 1fr; }
  .header { padding: 0 20px; }
  .tabs { padding: 0 20px; }
  .trust-bar-inner { padding: 0 20px; overflow-x: auto; }
  .hero { padding: 52px 20px 60px; }
  .time-grid { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a class="logo" href="/">
      <div class="logo-badge">HIK</div>
      <div class="logo-text">단기임대</div>
    </a>
    <button class="btn-admin" onclick="location.href='/admin'">관리자 로그인</button>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <div class="hero-eyebrow">✦ 검증된 단기임대 양도 플랫폼</div>
    <h1>신뢰할 수 있는<br><em>양도 매물</em>을 만나세요</h1>
    <p>검증된 단기임대 매물을 투명하게 공개합니다.<br>주요 대학가 및 상권 인근 매물을 확인하세요.</p>
    <div class="hero-stats">
      <div class="stat"><div class="stat-num" id="statCount">0</div><div class="stat-label">등록 매물</div></div>
      <div class="stat"><div class="stat-num">6</div><div class="stat-label">서비스 지역</div></div>
      <div class="stat"><div class="stat-num">100%</div><div class="stat-label">정보 투명 공개</div></div>
    </div>
  </div>
</section>

<div class="trust-bar">
  <div class="trust-bar-inner">
    <div class="trust-item"><span class="trust-icon">🔒</span> 검증된 매물만 등록</div>
    <div class="trust-item"><span class="trust-icon">📋</span> 보증금·월세 투명 공개</div>
    <div class="trust-item"><span class="trust-icon">📅</span> 방문 예약 즉시 확정</div>
  </div>
</div>

<div class="tabs-wrap">
  <div class="tabs" id="tabs">
    <button class="tab active" data-loc="전체" onclick="selectTab(this,'전체')">전체</button>
  </div>
</div>

<main class="main">
  <div class="section-header">
    <span class="section-title" id="sectionTitle">전체 매물</span>
    <span class="count-badge" id="listingCount"></span>
  </div>
  <div class="grid" id="grid"></div>
</main>

<!-- Visit Modal -->
<div class="overlay" id="visitOverlay" onclick="closeVisitModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div>
        <div class="modal-title">방문 예약</div>
        <div class="modal-addr" id="modalAddr"></div>
      </div>
      <button class="modal-close" onclick="closeVisitModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody">
      <div class="steps">
        <div class="step active" id="step1">① 날짜 선택</div>
        <div class="step" id="step2">② 시간 선택</div>
        <div class="step" id="step3">③ 정보 입력</div>
      </div>

      <div id="calSection">
        <div class="cal-label">방문 날짜를 선택해주세요</div>
        <div class="cal-nav">
          <button class="cal-btn" onclick="changeMonth(-1)">‹</button>
          <span class="cal-month" id="calMonth"></span>
          <button class="cal-btn" onclick="changeMonth(1)">›</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>

      <div id="timeSection" style="display:none">
        <div class="time-label">방문 시간을 선택해주세요</div>
        <div class="time-grid" id="timeGrid"></div>
      </div>

      <div id="bookingForm" style="display:none">
        <div class="form-group">
          <label>성함</label>
          <input type="text" id="visitorName" placeholder="홍길동">
        </div>
        <div class="form-group">
          <label>전화번호</label>
          <input type="tel" id="visitorPhone" placeholder="010-0000-0000">
        </div>
        <div style="background:#f4f6fb;border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:.78rem;color:#64748b;line-height:1.7;">
          📞 접수 순서대로 <strong style="color:#0b2559;">평일 오전 10시 ~ 오후 6시</strong> 사이에 순차적으로 연락드립니다.
        </div>
        <button class="btn-submit" id="submitBtn" onclick="submitVisit()">예약 확정하기 →</button>
      </div>
    </div>
  </div>
</div>

<script>
let currentLoc = '전체';
let currentListing = null;
let selectedDate = null;
let selectedTime = null;
let calYear, calMonth;

const TIME_SLOTS = ['10:30','11:00','11:30','12:00','12:30','13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00'];

async function init() {
  await loadLocations();
  await loadListings();
}

async function loadLocations() {
  const { locations } = await fetch('/api/locations').then(r => r.json());
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = `<button class="tab active" data-loc="전체" onclick="selectTab(this,'전체')">전체</button>`;
  locations.forEach(loc => {
    const btn = document.createElement('button');
    btn.className = 'tab';
    btn.dataset.loc = loc;
    btn.textContent = loc;
    btn.onclick = () => selectTab(btn, loc);
    tabs.appendChild(btn);
  });
}

async function loadListings() {
  const url = currentLoc === '전체' ? '/api/listings' : `/api/listings?location=${encodeURIComponent(currentLoc)}`;
  const { listings } = await fetch(url).then(r => r.json());
  document.getElementById('statCount').textContent = listings.length;
  renderListings(listings);
}

function selectTab(el, loc) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  currentLoc = loc;
  document.getElementById('sectionTitle').textContent = loc === '전체' ? '전체 매물' : `${loc} 매물`;
  loadListings();
}

function fmtKRW(n) {
  if (!n) return '-';
  if (n >= 100000000) return (n / 100000000).toFixed(n % 100000000 ? 1 : 0) + '억';
  if (n >= 10000) return Math.round(n / 10000) + '만원';
  return n.toLocaleString() + '원';
}

function renderListings(listings) {
  const grid = document.getElementById('grid');
  document.getElementById('listingCount').textContent = `${listings.length}개`;

  if (!listings.length) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <div class="empty-icon">🏠</div>
      <h3>등록된 매물이 없습니다</h3>
      <p>곧 새로운 매물이 등록될 예정입니다</p>
    </div>`;
    return;
  }

  grid.innerHTML = listings.map(l => {
    const imgs = l.images || [];
    const slides = imgs.length
      ? imgs.map((url, i) => `<div class="slide ${i===0?'active':''}" data-idx="${i}"><img src="${url}" alt="매물 이미지" loading="lazy"></div>`).join('')
      : `<div class="slide active"><div class="slide-placeholder"><div class="slide-placeholder-icon">🏠</div><div class="slide-placeholder-text">사진 준비중</div></div></div>`;
    const dots = imgs.length > 1
      ? `<div class="slide-nav">${imgs.map((_,i) => `<div class="slide-dot ${i===0?'active':''}" onclick="goSlide('${l.id}',${i},event)"></div>`).join('')}</div>` : '';
    const navBtns = imgs.length > 1
      ? `<button class="slide-btn prev" onclick="prevSlide('${l.id}',event)">‹</button><button class="slide-btn next" onclick="nextSlide('${l.id}',event)">›</button>` : '';
    const imgCount = imgs.length > 1 ? `<div class="img-count">📷 ${imgs.length}</div>` : '';

    const infoChips = [
      l.maintenanceFee && `<div class="chip">관리비 <span>${fmtKRW(l.maintenanceFee)}</span></div>`,
      l.facilityFee && `<div class="chip">시설비 <span>${fmtKRW(l.facilityFee)}</span></div>`,
      l.annualRevenue && `<div class="chip">연매출 <span>${fmtKRW(l.annualRevenue)}</span></div>`,
    ].filter(Boolean).join('');

    return `
    <div class="card" id="card-${l.id}">
      <div class="slideshow" id="ss-${l.id}">
        ${slides}
        <div class="loc-tag">${l.locationTag}</div>
        ${navBtns}${dots}${imgCount}
      </div>
      <div class="card-body">
        <div class="card-address">${l.address}</div>
        <div class="price-grid">
          <div class="price-cell">
            <div class="price-label">보증금</div>
            <div class="price-value">${fmtKRW(l.deposit)}</div>
          </div>
          <div class="price-cell">
            <div class="price-label">월세</div>
            <div class="price-value">${fmtKRW(l.monthlyRent)}</div>
          </div>
        </div>
        ${infoChips ? `<div class="info-chips">${infoChips}</div>` : ''}
        <button class="btn-visit" onclick="openVisitModal('${l.id}')">📅 방문 예약하기</button>
      </div>
    </div>`;
  }).join('');
}

// Slideshow
const ssState = {};
function getState(id) {
  if (!ssState[id]) { const slides = document.querySelectorAll(`#ss-${id} .slide`); ssState[id] = { idx: 0, total: slides.length }; }
  return ssState[id];
}
function goSlide(id, idx, e) { if (e) e.stopPropagation(); const s = getState(id); s.idx = idx; updateSlide(id); }
function prevSlide(id, e) { if (e) e.stopPropagation(); const s = getState(id); s.idx = (s.idx - 1 + s.total) % s.total; updateSlide(id); }
function nextSlide(id, e) { if (e) e.stopPropagation(); const s = getState(id); s.idx = (s.idx + 1) % s.total; updateSlide(id); }
function updateSlide(id) {
  const s = getState(id);
  document.querySelectorAll(`#ss-${id} .slide`).forEach((el, i) => el.classList.toggle('active', i === s.idx));
  document.querySelectorAll(`#card-${id} .slide-dot`).forEach((el, i) => el.classList.toggle('active', i === s.idx));
}

// Modal
async function openVisitModal(id) {
  const { listing } = await fetch(`/api/listings?action=get&id=${id}`).then(r => r.json());
  currentListing = listing;
  selectedDate = null;
  selectedTime = null;

  document.getElementById('modalAddr').textContent = `📍 ${listing.address} · ${listing.locationTag}`;
  document.getElementById('timeSection').style.display = 'none';
  document.getElementById('bookingForm').style.display = 'none';
  ['step1','step2','step3'].forEach((s,i) => { document.getElementById(s).className = 'step' + (i===0?' active':''); });

  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
  renderCalendar();
  document.getElementById('visitOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeVisitModal(e) {
  if (e && e.target !== document.getElementById('visitOverlay')) return;
  document.getElementById('visitOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function changeMonth(dir) {
  calMonth += dir;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
}

function renderCalendar() {
  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('calMonth').textContent = `${calYear}년 ${months[calMonth]}`;
  const grid = document.getElementById('calGrid');
  const today = new Date(); today.setHours(0,0,0,0);
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  let html = ['일','월','화','수','목','금','토'].map(d => `<div class="cal-day-name">${d}</div>`).join('');
  for (let i = 0; i < firstDay; i++) html += `<div class="cal-day empty-day"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(calYear, calMonth, d);
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isPast = date < today;
    const isSelected = selectedDate === dateStr;
    const isToday = date.getTime() === today.getTime();
    html += `<div class="cal-day${isPast?' disabled':''}${isSelected?' selected':''}${isToday&&!isSelected?' today':''}" onclick="${isPast?'':'selectDate(\''+dateStr+'\')'}">${d}</div>`;
  }
  grid.innerHTML = html;
}

function selectDate(dateStr) {
  selectedDate = dateStr;
  selectedTime = null;
  renderCalendar();
  document.getElementById('step1').className = 'step done';
  document.getElementById('step2').className = 'step active';
  const tg = document.getElementById('timeGrid');
  tg.innerHTML = TIME_SLOTS.map(t => `<div class="time-slot" onclick="selectTime('${t}')">${t}</div>`).join('');
  document.getElementById('timeSection').style.display = 'block';
  document.getElementById('bookingForm').style.display = 'none';
}

function selectTime(time) {
  selectedTime = time;
  document.querySelectorAll('.time-slot').forEach(el => el.classList.toggle('selected', el.textContent === time));
  document.getElementById('step2').className = 'step done';
  document.getElementById('step3').className = 'step active';
  document.getElementById('bookingForm').style.display = 'block';
  setTimeout(() => document.getElementById('bookingForm').scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
}

async function submitVisit() {
  const name = document.getElementById('visitorName').value.trim();
  const phone = document.getElementById('visitorPhone').value.trim();
  if (!name || !phone) return alert('성함과 연락처를 입력해주세요.');
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '예약 중...';
  const res = await fetch('/api/visits', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ listingId: currentListing.id, listingAddress: currentListing.address, locationTag: currentListing.locationTag, date: selectedDate, time: selectedTime, name, phone })
  });
  if (res.ok) {
    document.getElementById('modalBody').innerHTML = `
      <div class="success-wrap">
        <div class="success-circle">✅</div>
        <h3>예약이 완료됐습니다!</h3>
        <p>빠른 시간 내에 담당자가<br>연락드리겠습니다.</p>
        <div class="success-detail">
          <strong>매물</strong> ${currentListing.address}<br>
          <strong>위치</strong> ${currentListing.locationTag}<br>
          <strong>날짜</strong> ${selectedDate}<br>
          <strong>시간</strong> ${selectedTime}
        </div>
      </div>`;
  } else {
    btn.disabled = false; btn.textContent = '예약 확정하기 →';
    alert('오류가 발생했습니다. 다시 시도해주세요.');
  }
}

init();
</script>
